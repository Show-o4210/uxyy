name: Daily Sync File

on:
  schedule:
    # 每天 UTC 22:00 运行（对应 UTC+8 每天早晨 06:00）
    - cron: '0 22 * * *'
  # 支持在 GitHub 网页手动点击 Run workflow 测试
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch token.json from Raw URL
        run: |
          RAW_URL="https://raw.githubusercontent.com/gsfsfec/uyykbhhxf/main/pmbit.json"
          
          curl -sSL "$RAW_URL" -o token.json
          
          if [ ! -s token.json ]; then
            echo "Error: Downloaded file is empty!"
            exit 1
          fi

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update token.json [skip ci]"
          file_pattern: "token.json"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
          commit_author: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
